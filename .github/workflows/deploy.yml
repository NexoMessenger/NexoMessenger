name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VPS: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

jobs:
  emergency-recovery:
    if: ${{ contains(github.event.head_commit.message, '[recovery-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Prepare complete production dependencies on the runner
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Restore dependencies if the backend is down
        run: |
          tar czf - node_modules | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" '
            set -eu
            if curl -fsS --max-time 5 -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/api/health >/dev/null 2>&1; then cat >/dev/null; exit 0; fi
            if [ -f /var/www/nexo/server/index.mjs ] && [ -d /var/www/nexo/data ]; then DIR=/var/www/nexo
            elif [ -f "$HOME/nexo/server/index.mjs" ] && [ -d "$HOME/nexo/data" ]; then DIR="$HOME/nexo"
            else exit 1; fi
            STAGE="$DIR/.recovery-deps-$(date +%s)"
            mkdir "$STAGE"
            tar xzf - -C "$STAGE"
            [ -f "$STAGE/node_modules/express/package.json" ]
            if [ -e "$DIR/node_modules" ]; then mv "$DIR/node_modules" "$DIR/node_modules-before-recovery-$(date +%s)"; fi
            mv "$STAGE/node_modules" "$DIR/node_modules"
            rmdir "$STAGE"
          '
      - name: Check and restart the existing NEXO service if needed
        run: |
          set +e
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" 'bash -s' > /tmp/nexo-recovery-result <<'REMOTE'
          set -u
          if curl -fsS --max-time 5 -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
            echo 'FACT:local backend already responds'
            exit 0
          fi
          echo 'FACT:local backend is not responding'
          if [ -f /var/www/nexo/server/index.mjs ] && [ -d /var/www/nexo/data ]; then DIR=/var/www/nexo
          elif [ -f "$HOME/nexo/server/index.mjs" ] && [ -d "$HOME/nexo/data" ]; then DIR="$HOME/nexo"
          else echo 'FACT:existing deploy directory not found'; exit 1; fi
          echo "FACT:free disk MB $(df -Pm "$DIR" | awk 'NR==2 {print $4}')"
          echo "FACT:available memory MB $(awk '/MemAvailable:/ {print int($2/1024)}' /proc/meminfo)"
          if ! command -v node >/dev/null 2>&1; then echo 'FACT:node is unavailable'; exit 1; fi
          echo "FACT:node version $(node --version)"
          if [ -d "$DIR/node_modules/express" ]; then echo 'FACT:express dependency exists'; else echo 'FACT:express dependency missing'; fi
          if [ "$(id -u)" = 0 ]; then SUDO=''; elif sudo -n true 2>/dev/null; then SUDO='sudo -n'; else SUDO=none; fi
          if [ "$SUDO" != none ] && command -v systemctl >/dev/null 2>&1; then
            $SUDO systemctl restart nexo >/dev/null 2>&1 || echo 'FACT:service restart command failed'
          else
            echo 'FACT:starting existing server as deploy user'
            cd "$DIR" || exit 1
            if [ -f "$DIR/data/gigachat.env" ]; then
              PORT=8080 HOST=127.0.0.1 NEXO_REQUIRE_HTTPS=1 NEXO_DATA_DIR="$DIR/data" nohup node --env-file="$DIR/data/gigachat.env" server/index.mjs > "$DIR/server.log" 2>&1 </dev/null &
            else
              PORT=8080 HOST=127.0.0.1 NEXO_REQUIRE_HTTPS=1 NEXO_DATA_DIR="$DIR/data" nohup node server/index.mjs > "$DIR/server.log" 2>&1 </dev/null &
            fi
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo 'FACT:local backend responds after restart'
              exit 0
            fi
            sleep 5
          done
          if [ -f "$DIR/server.log" ]; then
            if grep -q 'ERR_MODULE_NOT_FOUND' "$DIR/server.log"; then echo 'FACT:server log reports missing module'; fi
            if grep -q 'EADDRINUSE' "$DIR/server.log"; then echo 'FACT:server log reports address already in use'; fi
            if grep -q 'ENOMEM' "$DIR/server.log"; then echo 'FACT:server log reports insufficient memory'; fi
            if grep -q 'ENOSPC' "$DIR/server.log"; then echo 'FACT:server log reports insufficient disk space'; fi
          fi
          echo 'FACT:local backend still does not respond'
          exit 1
          REMOTE
          status=$?
          while IFS= read -r line; do
            case "$line" in FACT:*) echo "::notice title=NEXO recovery::${line#FACT:}";; *) echo "$line";; esac
          done < /tmp/nexo-recovery-result
          exit "$status"
        shell: bash
      - name: Verify public health
        run: curl -fsS --max-time 15 https://nexomessenger.space/api/health

  safe-diagnostics:
    if: ${{ contains(github.event.head_commit.message, '[diagnostic-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Inspect disk and deployed files without changing them
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" 'bash -s' > /tmp/nexo-diagnostic <<'REMOTE'
          set -u
          if [ -d /var/www/nexo/data ]; then DIR=/var/www/nexo
          elif [ -d "$HOME/nexo/data" ]; then DIR="$HOME/nexo"
          else echo 'FACT:site data directory not found'; exit 1; fi
          echo "FACT:free disk MB $(df -Pm "$DIR" | awk 'NR==2 {print $4}')"
          echo "FACT:free inodes $(df -Pi "$DIR" | awk 'NR==2 {print $4}')"
          for item in dist server node_modules data; do
            if [ -d "$DIR/$item" ]; then echo "FACT:$item size MB $(du -sm "$DIR/$item" 2>/dev/null | cut -f1)"; else echo "FACT:$item missing"; fi
          done
          [ -f "$DIR/dist/index.html" ] && echo 'FACT:frontend entry exists' || echo 'FACT:frontend entry missing'
          [ -f "$DIR/node_modules/express/package.json" ] && echo 'FACT:express exists' || echo 'FACT:express missing'
          find "$DIR" -maxdepth 1 -type d -name '.deps-stage-*' -exec du -sm {} + 2>/dev/null | awk '{n++;s+=$1} END {print "FACT:staged dependency copies=" n+0 ", size MB=" s+0}'
          find "$DIR" -maxdepth 1 -type d -name 'node_modules-before-*' -exec du -sm {} + 2>/dev/null | awk '{n++;s+=$1} END {print "FACT:dependency backups=" n+0 ", size MB=" s+0}'
          REMOTE
          while IFS= read -r line; do case "$line" in FACT:*) echo "::notice title=NEXO diagnosis::${line#FACT:}";; esac; done < /tmp/nexo-diagnostic

  build-and-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-only]') && !contains(github.event.head_commit.message, '[diagnostic-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build website (server edition)
        # Frontend in "website mode": talks to the NEXO server API running
        # on this same VPS (same origin — no IP hardcoded in the code).
        run: npm run build:server

      # Build on the runner, not the low-memory VPS. Keep the running server's
      # dependencies intact until the replacement archive is complete.
      - name: Prepare production dependencies
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH preflight (connection, permissions, deploy dir)
        run: |
          echo "Target: $VPS (secret values are masked by GitHub)"
          DIR=""
          for i in 1 2 3; do
            OUT=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" '
              echo "== who =="; whoami; id
              if sudo -n true 2>/dev/null; then echo HAVE_SUDO; else echo NO_SUDO; fi
              echo "== perms before =="; ls -ld /var/www /var/www/nexo /var/www/nexo/dist /var/www/nexo/server 2>&1
              if sudo -n true 2>/dev/null; then
                sudo -n mkdir -p /var/www/nexo/dist /var/www/nexo/server
                sudo -n chown -R "$(whoami)" /var/www/nexo
              fi
              mkdir -p /var/www/nexo/dist /var/www/nexo/server 2>/dev/null
              echo "== perms after =="; ls -ld /var/www/nexo /var/www/nexo/dist /var/www/nexo/server 2>&1
              if [ -w /var/www/nexo/dist ] && [ -w /var/www/nexo/server ]; then
                echo DEPLOY_DIR=/var/www/nexo
              else
                mkdir -p "$HOME/nexo/dist" "$HOME/nexo/server"
                echo "DEPLOY_DIR=$HOME/nexo"
              fi
            ') && {
              echo "$OUT"
              DIR=$(printf '%s' "$OUT" | grep '^DEPLOY_DIR=' | tail -1 | cut -d= -f2-)
              [ -n "$DIR" ] && break
            }
            echo "SSH attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ -z "$DIR" ]; then
            echo "Cannot reach the VPS over SSH — check that it is online and port 22 is open."
            exit 1
          fi
          echo "DEPLOY_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Using deploy dir: $DIR"

      - name: Reclaim old dependency deployment copies
        run: |
          # These directories are generated copies of node_modules, not user data.
          # Keep the current tree and the three newest copies as fallbacks.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -eu
          [ -f "$DEPLOY_DIR/node_modules/express/package.json" ] || { echo 'Current dependencies missing; will not clean backups'; exit 1; }
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'node_modules-before-deploy-[0-9]*' -o -name 'node_modules-before-recovery-[0-9]*' \) \
            -printf '%T@\t%p\n' | sort -rn | tail -n +4 | cut -f2- | while IFS= read -r backup; do
            case "$backup" in
              "$DEPLOY_DIR"/node_modules-before-deploy-[0-9]*|"$DEPLOY_DIR"/node_modules-before-recovery-[0-9]*) rm -rf -- "$backup" ;;
              *) echo 'Unexpected backup path; stopping'; exit 1 ;;
            esac
          done
          available=$(df -Pm "$DEPLOY_DIR" | awk 'NR==2 {print $4}')
          echo "Free disk after dependency cleanup: $available MB"
          [ "$available" -ge 500 ] || { echo 'Not enough disk space to deploy safely'; exit 1; }
          REMOTE

      - name: Check HTTPS proxy before deployment
        run: |
          curl -fsS --max-time 15 https://nexomessenger.space/api/health | grep -q '"mode":"server"'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" 'bash -s' <<'REMOTE'
          set -eu
          command -v nginx >/dev/null
          # Trust forwarded scheme only if nginx replaces client-supplied values.
          grep -R -E -q 'proxy_set_header[[:space:]]+X-Forwarded-Proto[[:space:]]+[$]scheme[[:space:]]*;' /etc/nginx/sites-enabled /etc/nginx/conf.d
          REMOTE

      - name: Upload website + server to VPS (tar over SSH, with retries)
        run: |
          echo "Uploading to $VPS:$DEPLOY_DIR"
          send_dir() {
            for i in 1 2 3; do
              tar czf - -C "$1" . | ssh -o StrictHostKeyChecking=accept-new "$VPS" "mkdir -p '$2' && find '$2' -mindepth 1 -delete 2>/dev/null; tar xzf - -C '$2'" && return 0
              echo "upload of $1 attempt $i failed, retrying in 10s..."
              sleep 10
            done
            return 1
          }
          send_dir dist "$DEPLOY_DIR/dist"
          send_dir server "$DEPLOY_DIR/server"
          for i in 1 2 3; do
            tar czf - package.json package-lock.json ecosystem.config.cjs deploy/fix-port80.sh | ssh -o StrictHostKeyChecking=accept-new "$VPS" "tar xzf - -C '$DEPLOY_DIR'" && break
            echo "config upload attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Check existing production dependencies
        run: |
          # If the deployed tree already exactly satisfies this lockfile, avoid
          # copying another full dependency tree onto the small VPS.
          expected=$(sha256sum node_modules/.package-lock.json | cut -d' ' -f1)
          if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" "cd '$DEPLOY_DIR' && test -f node_modules/.package-lock.json && test \"\$(sha256sum node_modules/.package-lock.json | cut -d' ' -f1)\" = '$expected' && npm ls --omit=dev --all >/dev/null 2>&1"; then
            echo 'NEXO_DEPS_READY=1' >> "$GITHUB_ENV"
            echo '::notice title=NEXO deployment::Existing production dependencies are valid; transfer skipped.'
          else
            echo 'NEXO_DEPS_READY=0' >> "$GITHUB_ENV"
            echo '::notice title=NEXO deployment::Existing dependencies require replacement.'
          fi

      - name: Transfer prepared production dependencies
        if: env.NEXO_DEPS_READY != '1'
        run: |
          # Never touch data or the working dependencies on a failed extraction.
          set +e
          tar czf - node_modules | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" "DEPLOY_DIR='$DEPLOY_DIR' bash -c '
            set -eu
            stage=\"\$DEPLOY_DIR/.deps-stage-\$\$\"
            backup=\"\$DEPLOY_DIR/node_modules-before-deploy-\$\$\"
            mkdir \"\$stage\"
            tar xzf - -C \"\$stage\"
            test -f \"\$stage/node_modules/express/package.json\"
            if [ -e \"\$DEPLOY_DIR/node_modules\" ]; then mv \"\$DEPLOY_DIR/node_modules\" \"\$backup\"; fi
            if ! mv \"\$stage/node_modules\" \"\$DEPLOY_DIR/node_modules\"; then
              if [ -e \"\$backup\" ]; then mv \"\$backup\" \"\$DEPLOY_DIR/node_modules\"; fi
              exit 1
            fi
            rmdir \"\$stage\"
          '"
          result=$?
          if [ "$result" -ne 0 ]; then
            free=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$VPS" "df -Pm '$DEPLOY_DIR' | awk 'NR==2 {print \$4}'" || echo unknown)
            echo "::error title=NEXO dependency transfer::Transfer failed (exit $result); free disk MB: $free. Existing data was not removed."
            exit "$result"
          fi

      - name: Install deps and (re)start NEXO server on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$VPS" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -x
          cd "$DEPLOY_DIR" || { echo "No deploy dir $DEPLOY_DIR"; exit 1; }

          # sudo if we are not root and passwordless sudo exists
          SUDO=""
          if [ "$(id -u)" != "0" ] && sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          echo "SUDO='$SUDO' USER=$(whoami) DIR=$DEPLOY_DIR"

          # 1) Node.js runtime (install on Debian/Ubuntu if missing)
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            $SUDO apt-get install -y nodejs
          fi
          node --version

          # 2) Production dependencies were prepared on the runner and staged above.
          test -f node_modules/express/package.json

          # HTTPS terminates at the existing reverse proxy. Never overwrite its TLS configuration.
          if ! command -v nginx >/dev/null 2>&1; then
            echo 'HTTPS reverse proxy is required; refusing insecure deployment.'; exit 1
          fi
          NEXO_PORT=8080
          NGINX_OK=1

          # 4) Run the server: systemd if we can, else nohup.
          pkill -f "node .*server/index.mjs" 2>/dev/null || true
          sleep 1
          NODE_BIN=$(command -v node)
          if command -v systemctl >/dev/null 2>&1 && { [ "$(id -u)" = "0" ] || [ -n "$SUDO" ]; }; then
            cat > /tmp/nexo.service <<EOF
          [Unit]
          Description=NEXO Messenger website server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$DEPLOY_DIR
          ExecStart=$NODE_BIN $DEPLOY_DIR/server/index.mjs
          Environment=NODE_ENV=production
          Environment=HOST=127.0.0.1
          Environment=NEXO_REQUIRE_HTTPS=1
          Environment=PORT=$NEXO_PORT
          Environment=NEXO_DATA_DIR=$DEPLOY_DIR/data
          EnvironmentFile=-$DEPLOY_DIR/data/gigachat.env
          Restart=always
          RestartSec=3
          User=$(whoami)

          [Install]
          WantedBy=multi-user.target
          EOF
            $SUDO cp /tmp/nexo.service /etc/systemd/system/nexo.service
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable nexo
            $SUDO systemctl restart nexo
            sleep 3
            $SUDO systemctl is-active nexo || true
          else
            if [ -f "$DEPLOY_DIR/data/gigachat.env" ]; then
              PORT=$NEXO_PORT HOST=127.0.0.1 NEXO_REQUIRE_HTTPS=1 NEXO_DATA_DIR="$DEPLOY_DIR/data" nohup node --env-file="$DEPLOY_DIR/data/gigachat.env" server/index.mjs > "$DEPLOY_DIR/server.log" 2>&1 &
            else
              PORT=$NEXO_PORT HOST=127.0.0.1 NEXO_REQUIRE_HTTPS=1 NEXO_DATA_DIR="$DEPLOY_DIR/data" nohup node server/index.mjs > "$DEPLOY_DIR/server.log" 2>&1 &
            fi
            sleep 3
          fi

          # 5) Local health check — fails the step if server is down.
          curl -sf -H "X-Forwarded-Proto: https" http://127.0.0.1:$NEXO_PORT/api/health || { echo "NEXO backend health check failed"; exit 1; }
          echo ""
          echo "NEXO server is up on port $NEXO_PORT (dir: $DEPLOY_DIR)"
          if [ "${NGINX_OK:-1}" = "0" ]; then
            echo "::warning::Port 80/domain still serves the OLD static copy (workflow has no rights to reconfigure nginx). The real site works on port 8080. To fix nexomessenger.space + port 80 + HTTPS once, run on the server console: sudo bash $DEPLOY_DIR/deploy/fix-port80.sh"
          fi
          REMOTE

      - name: Verify public HTTPS site
        run: |
          for i in $(seq 1 6); do
            if curl -fsS --max-time 15 "https://nexomessenger.space/api/health" | grep -q '"mode":"server"'; then
              result=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'X-Forwarded-Proto: https' http://nexomessenger.space/api/health)
              case "$result" in "301 https://nexomessenger.space/"*|"302 https://nexomessenger.space/"*|"307 https://nexomessenger.space/"*|"308 https://nexomessenger.space/"*) exit 0;; *) echo "HTTP bypass check failed: $result"; exit 1;; esac
            fi
            sleep 5
          done
          echo "HTTPS health check failed"; exit 1
