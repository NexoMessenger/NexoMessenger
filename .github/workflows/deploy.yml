name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VPS: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build website (server edition)
        # Frontend in "website mode": talks to the NEXO server API running
        # on this same VPS (same origin — no IP hardcoded in the code).
        run: npm run build:server

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH preflight (connection, permissions, deploy dir)
        run: |
          echo "Target: $VPS (secret values are masked by GitHub)"
          DIR=""
          for i in 1 2 3; do
            OUT=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" '
              echo "== who =="; whoami; id
              if sudo -n true 2>/dev/null; then echo HAVE_SUDO; else echo NO_SUDO; fi
              echo "== perms before =="; ls -ld /var/www /var/www/nexo /var/www/nexo/dist /var/www/nexo/server 2>&1
              if sudo -n true 2>/dev/null; then
                sudo -n mkdir -p /var/www/nexo/dist /var/www/nexo/server
                sudo -n chown -R "$(whoami)" /var/www/nexo
              fi
              mkdir -p /var/www/nexo/dist /var/www/nexo/server 2>/dev/null
              echo "== perms after =="; ls -ld /var/www/nexo /var/www/nexo/dist /var/www/nexo/server 2>&1
              if [ -w /var/www/nexo/dist ] && [ -w /var/www/nexo/server ]; then
                echo DEPLOY_DIR=/var/www/nexo
              else
                mkdir -p "$HOME/nexo/dist" "$HOME/nexo/server"
                echo "DEPLOY_DIR=$HOME/nexo"
              fi
            ') && {
              echo "$OUT"
              DIR=$(printf '%s' "$OUT" | grep '^DEPLOY_DIR=' | tail -1 | cut -d= -f2-)
              [ -n "$DIR" ] && break
            }
            echo "SSH attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ -z "$DIR" ]; then
            echo "Cannot reach the VPS over SSH — check that it is online and port 22 is open."
            exit 1
          fi
          echo "DEPLOY_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Using deploy dir: $DIR"

      - name: Upload website + server to VPS (tar over SSH, with retries)
        run: |
          echo "Uploading to $VPS:$DEPLOY_DIR"
          send_dir() {
            for i in 1 2 3; do
              tar czf - -C "$1" . | ssh -o StrictHostKeyChecking=accept-new "$VPS" "mkdir -p '$2' && find '$2' -mindepth 1 -delete 2>/dev/null; tar xzf - -C '$2'" && return 0
              echo "upload of $1 attempt $i failed, retrying in 10s..."
              sleep 10
            done
            return 1
          }
          send_dir dist "$DEPLOY_DIR/dist"
          send_dir server "$DEPLOY_DIR/server"
          for i in 1 2 3; do
            tar czf - package.json package-lock.json ecosystem.config.cjs deploy/fix-port80.sh | ssh -o StrictHostKeyChecking=accept-new "$VPS" "tar xzf - -C '$DEPLOY_DIR'" && break
            echo "config upload attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Install deps and (re)start NEXO server on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$VPS" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -x
          cd "$DEPLOY_DIR" || { echo "No deploy dir $DEPLOY_DIR"; exit 1; }

          # sudo if we are not root and passwordless sudo exists
          SUDO=""
          if [ "$(id -u)" != "0" ] && sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          echo "SUDO='$SUDO' USER=$(whoami) DIR=$DEPLOY_DIR"

          # 1) Node.js runtime (install on Debian/Ubuntu if missing)
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            $SUDO apt-get install -y nodejs
          fi
          node --version

          # 2) Server dependencies (express, ws)
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

          # 3) Ports: nginx (if present) stays on :80 and proxies to Node
          #    on :8080; without nginx Node serves :80 (root) or :8080.
          NGINX_OK=0
          if command -v nginx >/dev/null 2>&1; then
            NEXO_PORT=8080
            cat > /tmp/nexo-nginx.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name nexomessenger.space www.nexomessenger.space _;
            client_max_body_size 25m;
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
          NGINX
            $SUDO mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            if $SUDO cp /tmp/nexo-nginx.conf /etc/nginx/sites-available/nexo; then
              $SUDO ln -sf /etc/nginx/sites-available/nexo /etc/nginx/sites-enabled/nexo
              if [ -e /etc/nginx/sites-enabled/default ]; then
                $SUDO mv /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak || true
              fi
              if $SUDO nginx -t; then
                $SUDO systemctl reload nginx 2>/dev/null || $SUDO service nginx reload 2>/dev/null || $SUDO nginx -s reload 2>/dev/null || true
                NGINX_OK=1
              fi
            fi
            echo "NGINX_OK=$NGINX_OK (if 0, site will answer on :8080 directly)"
          elif [ "$(id -u)" = "0" ]; then
            NEXO_PORT=80
          else
            NEXO_PORT=8080
          fi
          echo "NEXO_PORT=$NEXO_PORT"

          # 4) Run the server: systemd if we can, else nohup.
          pkill -f "node .*server/index.mjs" 2>/dev/null || true
          sleep 1
          NODE_BIN=$(command -v node)
          if command -v systemctl >/dev/null 2>&1 && { [ "$(id -u)" = "0" ] || [ -n "$SUDO" ]; }; then
            cat > /tmp/nexo.service <<EOF
          [Unit]
          Description=NEXO Messenger website server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=$DEPLOY_DIR
          ExecStart=$NODE_BIN $DEPLOY_DIR/server/index.mjs
          Environment=NODE_ENV=production
          Environment=HOST=0.0.0.0
          Environment=PORT=$NEXO_PORT
          Environment=NEXO_DATA_DIR=$DEPLOY_DIR/data
          EnvironmentFile=-$DEPLOY_DIR/data/gigachat.env
          Restart=always
          RestartSec=3
          User=$(whoami)

          [Install]
          WantedBy=multi-user.target
          EOF
            $SUDO cp /tmp/nexo.service /etc/systemd/system/nexo.service
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable nexo
            $SUDO systemctl restart nexo
            sleep 3
            $SUDO systemctl is-active nexo || true
          else
            if [ -f "$DEPLOY_DIR/data/gigachat.env" ]; then
              PORT=$NEXO_PORT HOST=0.0.0.0 NEXO_DATA_DIR="$DEPLOY_DIR/data" nohup node --env-file="$DEPLOY_DIR/data/gigachat.env" server/index.mjs > "$DEPLOY_DIR/server.log" 2>&1 &
            else
              PORT=$NEXO_PORT HOST=0.0.0.0 NEXO_DATA_DIR="$DEPLOY_DIR/data" nohup node server/index.mjs > "$DEPLOY_DIR/server.log" 2>&1 &
            fi
            sleep 3
          fi

          # 5) Local health check — fails the step if server is down.
          curl -sf http://127.0.0.1:$NEXO_PORT/api/health
          echo ""
          echo "NEXO server is up on port $NEXO_PORT (dir: $DEPLOY_DIR)"
          if [ "${NGINX_OK:-1}" = "0" ]; then
            echo "::warning::Port 80/domain still serves the OLD static copy (workflow has no rights to reconfigure nginx). The real site works on port 8080. To fix nexomessenger.space + port 80 + HTTPS once, run on the server console: sudo bash $DEPLOY_DIR/deploy/fix-port80.sh"
          fi
          REMOTE

      - name: Verify public site answers as server mode
        run: |
          for base in "http://${{ secrets.SSH_HOST }}" "http://${{ secrets.SSH_HOST }}:8080"; do
            for i in $(seq 1 6); do
              if curl -sf "$base/api/health" | grep -q '"mode":"server"'; then
                echo "Public site is live in server mode: $base/"
                exit 0
              fi
              echo "Waiting for $base ... ($i/6)"
              sleep 5
            done
          done
          echo "Public /api/health did not answer in server mode (see server step log above)."
          exit 1

      - name: Check custom domain (warning only)
        run: |
          if curl -sf "https://nexomessenger.space/api/health" | grep -q '"mode":"server"'; then
            echo "Custom domain is live in server mode: https://nexomessenger.space/"
          elif curl -sf "http://nexomessenger.space/api/health" | grep -q '"mode":"server"'; then
            echo "::warning::http://nexomessenger.space works in server mode, but HTTPS is not ready yet. Run once on the server console: sudo bash $DEPLOY_DIR/deploy/fix-port80.sh"
          else
            echo "::warning::nexomessenger.space does not serve the real NEXO server yet (DNS already points to this VPS; nginx still serves the old static copy). Run once on the server console: sudo bash $DEPLOY_DIR/deploy/fix-port80.sh"
          fi
