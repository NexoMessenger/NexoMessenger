name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VPS: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build website (server edition)
        # Frontend in "website mode": talks to the NEXO server API running
        # on this same VPS (same origin — no IP hardcoded in the code).
        run: npm run build:server

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH preflight (connection, disk, dirs)
        run: |
          echo "Target: $VPS (secret values are masked by GitHub)"
          for i in 1 2 3; do
            ssh -v -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS" \
              "echo SSH_OK; whoami; df -h / | tail -1; mkdir -p /var/www/nexo/dist /var/www/nexo/server" && exit 0
            echo "SSH attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Cannot reach the VPS over SSH — check that it is online and port 22 is open."
          exit 1

      - name: Upload website + server to VPS (rsync, with retries)
        run: |
          upload() {
            for i in 1 2 3; do
              rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new" "$@" && return 0
              echo "rsync attempt $i failed, retrying in 10s..."
              sleep 10
            done
            return 1
          }
          upload dist/ "$VPS:/var/www/nexo/dist/"
          upload server/ "$VPS:/var/www/nexo/server/"
          rsync -az -e "ssh -o StrictHostKeyChecking=accept-new" package.json package-lock.json ecosystem.config.cjs "$VPS:/var/www/nexo/"

      - name: Install deps and (re)start NEXO server on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$VPS" 'bash -s' <<'REMOTE'
          set -x
          cd /var/www/nexo

          # 1) Node.js runtime (install on Debian/Ubuntu if missing)
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs || sudo apt-get install -y nodejs
          fi
          node --version

          # 2) Server dependencies (express, ws)
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

          # 3) Ports: nginx (if present) stays on :80 and proxies to Node
          #    on :8080; without nginx Node serves :80 itself.
          if command -v nginx >/dev/null 2>&1; then
            NEXO_PORT=8080
            cat > /tmp/nexo-nginx.conf <<'NGINX'
          server {
            listen 80 default_server;
            server_name _;
            location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
          }
          NGINX
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            cp /tmp/nexo-nginx.conf /etc/nginx/sites-available/nexo 2>/dev/null || sudo cp /tmp/nexo-nginx.conf /etc/nginx/sites-available/nexo
            ln -sf /etc/nginx/sites-available/nexo /etc/nginx/sites-enabled/nexo 2>/dev/null || sudo ln -sf /etc/nginx/sites-available/nexo /etc/nginx/sites-enabled/nexo
            if [ -e /etc/nginx/sites-enabled/default ]; then
              mv /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak 2>/dev/null || sudo mv /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/default.bak || true
            fi
            nginx -t 2>/dev/null || sudo nginx -t
            systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || nginx -s reload 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || true
          else
            NEXO_PORT=80
          fi
          echo "NEXO_PORT=$NEXO_PORT"

          # 4) Run the server: systemd if root, else nohup.
          pkill -f "node server/index.mjs" 2>/dev/null || true
          sleep 1
          if command -v systemctl >/dev/null 2>&1 && [ "$(id -u)" = "0" ]; then
            cat > /etc/systemd/system/nexo.service <<EOF
          [Unit]
          Description=NEXO Messenger website server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/var/www/nexo
          ExecStart=$(command -v node) /var/www/nexo/server/index.mjs
          Environment=NODE_ENV=production
          Environment=HOST=0.0.0.0
          Environment=PORT=$NEXO_PORT
          Restart=always
          RestartSec=3
          User=root

          [Install]
          WantedBy=multi-user.target
          EOF
            systemctl daemon-reload
            systemctl enable nexo
            systemctl restart nexo
            sleep 3
            systemctl is-active nexo
          else
            PORT=$NEXO_PORT HOST=0.0.0.0 nohup node server/index.mjs > /var/www/nexo/server.log 2>&1 &
            sleep 3
          fi

          # 5) Local health check — fails the step if server is down.
          curl -sf http://127.0.0.1:$NEXO_PORT/api/health
          echo ""
          echo "NEXO server is up on port $NEXO_PORT"
          REMOTE

      - name: Verify public site answers as server mode
        run: |
          for i in $(seq 1 12); do
            if curl -sf "http://${{ secrets.SSH_HOST }}/api/health" | grep -q '"mode":"server"'; then
              echo "Public site is live in server mode: http://${{ secrets.SSH_HOST }}/"
              exit 0
            fi
            echo "Waiting for public site... ($i/12)"
            sleep 5
          done
          echo "Public /api/health did not answer in server mode yet (nginx may need a manual look)."
          exit 1
