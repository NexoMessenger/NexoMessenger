# ============================================================
# Сборка мода RustLike (Minecraft 1.20.1 + Forge) в GitHub Actions.
#
# Безопасность:
#   - запускается ТОЛЬКО при пуше в ветку arena/faf605bf-nexomessenger
#     (по путям rustlike/** и этого файла) или вручную (workflow_dispatch);
#   - НЕ затрагивает main и деплой NEXO Messenger (deploy.yml/deploy-pages.yml
#     триггерятся только на main);
#   - минимальные права: contents: read; никакие секреты не используются;
#   - результат — JAR-артефакт сборки (без публикации релизов).
#   - при ошибке компиляции тексты ошибок публикуются как аннотации
#     и в Step Summary (чтобы их было видно без скачивания логов).
# ============================================================
name: Build RustLike mod

on:
  push:
    branches: [arena/faf605bf-nexomessenger]
    paths:
      - 'rustlike/**'
      - '.github/workflows/build-rustlike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustlike-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            rustlike/gradle/wrapper/gradle-wrapper.properties
            rustlike/build.gradle

      - name: Show environment
        run: |
          java -version
          chmod +x rustlike/gradlew

      - name: Build (gradlew build)
        working-directory: rustlike
        shell: bash
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: List produced jars
        run: ls -la rustlike/build/libs/

      - name: Publish build errors (annotations + summary)
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Ошибка сборки RustLike"
            echo '```'
            grep -E "error:|FAILURE:|What went wrong|Could not |Execution failed|A problem occurred|Caused by:" /tmp/gradle.log | head -60 || echo "(подробности в логе шага Build)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "error:|FAILURE:|What went wrong|Could not |Execution failed|A problem occurred|Caused by:" /tmp/gradle.log \
            | head -40 | while IFS= read -r line; do
                echo "::error::${line}"
              done
          echo "::error::Сборка упала — см. Step Summary выше (полный текст в логе шага Build)"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustlike-mod-jar
          path: |
            rustlike/build/libs/*.jar
            !rustlike/build/libs/*-sources.jar
            !rustlike/build/libs/*-dev.jar
            !rustlike/build/libs/*-slim.jar
          if-no-files-found: error
          retention-days: 30
