# ============================================================
# Сборка мода RustLike (Minecraft 1.20.1 + Forge) в GitHub Actions.
#
# Безопасность:
#   - запускается ТОЛЬКО при пуше в ветку arena/faf605bf-nexomessenger
#     (по путям rustlike/** и этого файла) или вручную (workflow_dispatch);
#   - НЕ затрагивает main и деплой NEXO Messenger (deploy.yml/deploy-pages.yml
#     триггерятся только на main);
#   - минимальные права: contents: read; никакие секреты не используются;
#   - результат — JAR-артефакт сборки (без публикации релизов).
#   - при ошибке компиляции тексты ошибок публикуются как аннотации
#     и в Step Summary (чтобы их было видно без скачивания логов).
# ============================================================
name: Build RustLike mod

on:
  push:
    branches: [arena/faf605bf-nexomessenger]
    paths:
      - 'rustlike/**'
      - '.github/workflows/build-rustlike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustlike-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            rustlike/gradle/wrapper/gradle-wrapper.properties
            rustlike/build.gradle

      - name: Show environment
        run: |
          java -version
          chmod +x rustlike/gradlew

      - name: Build (gradlew build)
        working-directory: rustlike
        shell: bash
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: List produced jars
        run: ls -la rustlike/build/libs/

      - name: Publish build errors (annotations + summary)
        if: failure()
        shell: bash
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, re, sys

          summary_path = sys.argv[1]
          try:
              lines = open('/tmp/gradle.log', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = []

          src = re.compile(r'([\w./-]+\.java):(\d+): error: (.*)')
          other = re.compile(r'(FAILURE:|What went wrong|Could not |Execution failed|A problem occurred|Caused by:|error:)')

          java_errors, misc = [], []
          for i, line in enumerate(lines):
              m = src.search(line)
              if m:
                  extra = []
                  for j in range(i + 1, min(i + 7, len(lines))):
                      s = lines[j].strip()
                      if s.startswith(('symbol:', 'location:', 'required:', 'found:')):
                          extra.append(s)
                      elif s and not s.startswith('^') and extra:
                          break
                  java_errors.append(
                      '%s:%s: error: %s %s' % (m.group(1), m.group(2), m.group(3).strip(),
                                               ' | '.join(dict.fromkeys(extra))))
              elif other.search(line):
                  misc.append(line.strip())

          # Убираем дубли, сохраняя порядок
          uniq = lambda seq: list(dict.fromkeys(seq))
          java_errors, misc = uniq(java_errors), uniq(misc)

          with open(summary_path, 'a', encoding='utf-8') as out:
              out.write('## ❌ Ошибка сборки RustLike\n\n')
              if java_errors:
                  out.write('### Ошибки компиляции (%d)\n\n```\n%s\n```\n\n'
                            % (len(java_errors), '\n'.join(java_errors[:80])))
              if misc:
                  out.write('### Прочее\n\n```\n%s\n```\n\n' % '\n'.join(misc[:40]))
              if not java_errors and not misc:
                  out.write('Подробности в логе шага Build.\n')

          for e in java_errors[:60] + misc[:20]:
              print('::error::' + e.replace('\n', ' '))
          print('::error::Сборка упала — полный список в Step Summary')
          PY

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustlike-mod-jar
          path: |
            rustlike/build/libs/*.jar
            !rustlike/build/libs/*-sources.jar
            !rustlike/build/libs/*-dev.jar
            !rustlike/build/libs/*-slim.jar
          if-no-files-found: error
          retention-days: 30
