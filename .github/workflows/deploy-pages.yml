name: Deploy NEXO Messenger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report backend mode
        run: |
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ] && [ -n "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "Backend mode: SUPABASE (real multi-user sync)"
          else
            echo "::warning::Backend mode: LOCAL DEMO — VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo Variables are empty. Users on different devices will NOT see each other. See README → 'Make friends visible'."
          fi

      - name: Build
        run: npm run build
        env:
          # Optional: set these as repository Variables (Settings → Secrets and
          # variables → Actions → Variables) to build against Supabase.
          # When empty, the app runs in Local Demo Mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
